services:
  - type: web
    name: sales-mis-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: SALES_MIS_USERNAME
        sync: false
      - key: SALES_MIS_PASSWORD
        sync: false
      - key: SALES_MIS_STORAGE_BUCKET
        sync: false
      - key: SALES_MIS_STORAGE_ENDPOINT_URL
        sync: false
      - key: SALES_MIS_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: SALES_MIS_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: SALES_MIS_STORAGE_REGION
        value: auto
      - key: SALES_MIS_STORAGE_PREFIX
        value: velnik-mis/
