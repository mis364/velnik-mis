services:
  - type: web
    name: sales-mis-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: SALES_MIS_USERNAME
        sync: false
      - key: SALES_MIS_PASSWORD
        sync: false
      - key: SALES_MIS_STORAGE_PROVIDER
        sync: false
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
